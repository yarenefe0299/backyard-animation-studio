# Keep the existing workflow filename so the website can dispatch a review branch.
name: Render full backyard episode
on:
  workflow_dispatch:
    inputs:
      episode:
        description: Full episode to render
        type: choice
        options:
          - flying-armor
        default: flying-armor
permissions:
  contents: read
concurrency:
  group: backyard-episode-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      composition: ${{ steps.plan.outputs.composition }}
      episode: ${{ steps.plan.outputs.episode }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm test && npm run build
      - id: plan
        name: Plan the complete episode
        env:
          EPISODE_ID: ${{ inputs.episode || 'flying-armor' }}
        run: node --experimental-strip-types scripts/plan-episode.ts "$EPISODE_ID"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: episode-plan
          path: |
            out/manifest.json
            out/story.srt
          retention-days: 1
  render:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Render a segment of the full timeline
        env:
          COMPOSITION_ID: ${{ needs.plan.outputs.composition }}
          FIRST_FRAME: ${{ matrix.from }}
          LAST_FRAME: ${{ matrix.to }}
          FRAME_COUNT: ${{ matrix.frames }}
        run: |
          mkdir -p work/chunk
          npx --no-install remotion render src/index.ts "$COMPOSITION_ID" work/chunk/chunk.mp4 --frames="$FIRST_FRAME-$LAST_FRAME" --codec=h264 --pixel-format=yuv420p --crf=20 --concurrency=2 --gl=swangle --log=info
          node --experimental-strip-types scripts/check-chunk.ts work/chunk/chunk.mp4 "$FRAME_COUNT"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: episode-chunk-${{ matrix.id }}
          path: work/chunk/chunk.mp4
          retention-days: 1
  assemble:
    needs: [plan, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - uses: actions/download-artifact@v8.0.2
        with:
          name: episode-plan
          path: plan
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: episode-chunk-*
          path: segments
      - name: Join and verify the full episode
        run: node --experimental-strip-types scripts/assemble-episode.ts
      - name: Preserve notices
        if: always()
        run: npm run licenses
      - name: Upload the complete video
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: full-backyard-episode-${{ github.run_number }}
          path: out/
          retention-days: 3
          if-no-files-found: error
